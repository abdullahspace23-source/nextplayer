name: Build Release APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease
      - name: Sign APKs
        run: |
          keytool -genkeypair -keystore my.jks -alias key -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=MyPlayer"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          mkdir signed
          for f in app/build/outputs/apk/release/*.apk; do
            $APKSIGNER sign --ks my.jks --ks-pass pass:android123 --key-pass pass:android123 --out signed/$(basename $f) $f
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nextplayer-release
          path: signed/*arm64-v8a*.apk
          if-no-files-found: error
